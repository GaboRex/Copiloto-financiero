<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Copiloto Financiero">
  <title>Copiloto Financiero</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A7068"/>
      <stop offset="1" stop-color="#1A4F4A"/>
    </linearGradient>
  </defs>
  <!-- Fondo: cuadrado redondeado verde de la marca -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <circle cx="256" cy="140" r="210" fill="#FFFFFF" opacity="0.06"/>

  <!-- Antena -->
  <line x1="256" y1="150" x2="256" y2="104" stroke="#F3F0E4" stroke-width="16" stroke-linecap="round"/>
  <circle cx="256" cy="92" r="26" fill="#E9B65C" opacity="0.28"/>
  <circle cx="256" cy="92" r="19" fill="#E9B65C"/>

  <!-- Orejas -->
  <rect x="86" y="218" width="34" height="78" rx="17" fill="#C1892E"/>
  <rect x="392" y="218" width="34" height="78" rx="17" fill="#C1892E"/>

  <!-- Cabeza -->
  <rect x="108" y="148" width="296" height="232" rx="84" fill="#F3F0E4"/>
  <!-- Pantalla -->
  <rect x="146" y="188" width="220" height="150" rx="54" fill="#22302C"/>
  <!-- Ojos -->
  <ellipse cx="212" cy="252" rx="22" ry="27" fill="#8FE0D0"/>
  <ellipse cx="300" cy="252" rx="22" ry="27" fill="#8FE0D0"/>
  <!-- Sonrisa -->
  <path d="M222 298 q34 26 68 0" stroke="#8FE0D0" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- Mejillas -->
  <circle cx="160" cy="330" r="12" fill="#E9B65C" opacity="0.55"/>
  <circle cx="352" cy="330" r="12" fill="#E9B65C" opacity="0.55"/>

  <!-- Insignia: gráfico que sube -->
  <circle cx="256" cy="424" r="42" fill="#F3F0E4"/>
  <polyline points="230,440 248,422 262,433 284,410" fill="none" stroke="#1F5C56" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="270,410 284,410 284,424" fill="none" stroke="#1F5C56" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
